spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/house_auction_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  jwt-secret: ${APP_JWT_SECRET:local-dev-only-change-in-production}
  jwt-expiration: ${APP_JWT_EXPIRATION:86400000}
  otp-expiry-minutes: ${APP_OTP_EXPIRY_MINUTES:5}
  admin-email: ${APP_ADMIN_EMAIL:admin@example.com}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

file:
  upload-dir: uploads

server:
  address: 0.0.0.0
  port: ${PORT:8081}
